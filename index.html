document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

op: none; max-height: 62%; }\n    .legend { display: none; }\n    .stat.lead .value { font-size: 34px; }\n    .stat .value { font-size: 26px; }\n  }\n  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div id=\"map\" role=\"application\" aria-label=\"Washington wildfire map\"><\u002Fdiv>\n\n<section class=\"panel\" aria-label=\"Situation summary\">\n  <div class=\"panel-head\">\n    <p class=\"kicker\">Washington · DNR<\u002Fp>\n    <h1 class=\"title\">Washington Fire Situational Dashboard<\u002Fh1>\n    <p class=\"byline\">By Ben Luthy<\u002Fp>\n    <div class=\"sync\">\n      <span class=\"dot\" id=\"syncDot\" aria-hidden=\"true\"><\u002Fspan>\n      <span id=\"syncText\">Connecting to feed…<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"find\">\n      <svg class=\"find-icon\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><line x1=\"16.2\" y1=\"16.2\" x2=\"21\" y2=\"21\"><\u002Fline><\u002Fsvg>\n      <input id=\"findInput\" class=\"find-input\" type=\"text\" placeholder=\"Find a Washington address\" autocomplete=\"off\" spellcheck=\"false\" role=\"combobox\" aria-expanded=\"false\" aria-autocomplete=\"list\" aria-controls=\"findList\" aria-label=\"Find a Washington address\">\n      <button class=\"find-clear\" id=\"findClear\" type=\"button\" aria-label=\"Clear search\" hidden=\"\">✕<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div id=\"body\">\n    <div class=\"msg\">Loading current incidents…<\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"panel-foot\">\n    <div class=\"source\">\n      Source · <b>WA DNR Public Wildfire<\u002Fb><br>ArcGIS · Current DNR Fire Statistics\n    <\u002Fdiv>\n    <button class=\"reload\" id=\"reload\" type=\"button\">Sync<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n\n<div class=\"legend\" aria-hidden=\"true\">\n  <span>Acreage<\u002Fspan>\n  <span class=\"swatch\"><span class=\"d s\"><\u002Fspan> &lt;10<\u002Fspan>\n  <span class=\"swatch\"><span class=\"d m\"><\u002Fspan> 100+<\u002Fspan>\n  <span class=\"swatch\"><span class=\"d l\"><\u002Fspan> 1k+<\u002Fspan>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    var self = this;\n    var wait = setInterval(function () {\n      if (window.L && document.getElementById(\"map\")) { clearInterval(wait); self.boot(); }\n    }, 60);\n  }\n\n  componentWillUnmount() {\n    clearInterval(this.relTimer);\n    clearInterval(this.refreshTimer);\n  }\n\n  boot() {\n    \"use strict\";\n    var EMBER = \"#e8853d\";\n    var EMBER_HOT = \"#ffb066\";\n    var ENDPOINT =\n      \"https://gis.dnr.wa.gov/site3/rest/services/Public_Wildfire/\" +\n      \"WADNR_PUBLIC_WD_WildFire_Data/MapServer/1/query\";\n    // Layer 1 = \"Current DNR Fire Statistics\" (current calendar year).\n    // WA DNR's own Experience Builder dashboard shows this layer with this exact\n    // definition expression. Without it the layer also carries incidents DNR only\n    // recorded — ~150 records / ~224k acres in 2026 — and every total runs high.\n    var DEF_WHERE = \"FIREGCAUSE_LABEL_NM <> 'DNR NOT RESPONSIBLE'\";\n    // The service caps a single response at maxRecordCount (2000). WA has cleared\n    // that in a busy year (2021: 2221, 2025: 2111), so page rather than truncate.\n    var PAGE_SIZE = 1000;\n\n    // DNR's layer only covers fires on or threatening DNR-protected land, so\n    // anything on federal ground is absent from it — Grand Park 2 on the Rainier\n    // side, for one. NIFC's Current Incidents feed is the interagency roster and\n    // is what DNR's own dashboard uses for live incidents, so current activity\n    // comes from here and DNR layer 1 is left to do season statistics.\n    var NIFC_ENDPOINT =\n      \"https://services9.arcgis.com/RHVPKKiFTONKtxq3/arcgis/rest/services/\" +\n      \"USA_Wildfires_v1/FeatureServer/0/query\";\n    var NIFC_WHERE = \"POOState = 'US-WA'\";\n    // Note on this layer: a record stays open until DNR files an out-date, and\n    // that filing lags the fire by weeks — two thirds of the open 2026 records\n    // were already controlled and just awaiting paperwork. So it is not a live\n    // activity signal, and current incidents come from NIFC below instead.\n    var REFRESH_MS = 60 * 60 * 1000;\n\n    var map = L.map(\"map\", {\n      center: [47.3, -120.4], zoom: 7, zoomControl: true,\n      attributionControl: true, preferCanvas: true,\n    });\n    map.zoomControl.setPosition(\"bottomleft\");\n\n    L.tileLayer(\"https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png\", {\n      subdomains: \"abcd\", maxZoom: 19,\n      attribution: '&copy; <a href=\"https://www.openstreetmap.org/copyright\">OSM<\u002Fa> &copy; <a href=\"https://carto.com/attributions\">CARTO<\u002Fa> · WA DNR',\n    }).addTo(map);\n    L.tileLayer(\"https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png\",\n      { subdomains: \"abcd\", maxZoom: 19, opacity: 0.45, pane: \"shadowPane\" }).addTo(map);\n\n    map.createPane(\"fire\");\n    map.getPane(\"fire\").classList.add(\"pane-fire\");\n    map.getPane(\"fire\").style.zIndex = 620;\n    // featureGroup, not layerGroup: only FeatureGroup implements getBounds(),\n    // which the initial fit below depends on.\n    var fireLayer = L.featureGroup([], { pane: \"fire\" }).addTo(map);\n\n    var $body = document.getElementById(\"body\");\n    var $syncDot = document.getElementById(\"syncDot\");\n    var $syncText = document.getElementById(\"syncText\");\n    var $reload = document.getElementById(\"reload\");\n    var lastSync = null;\n    var fitted = false;\n\n    function fmt(n) {\n      if (n == null || isNaN(n)) return \"—\";\n      return Math.round(n).toLocaleString(\"en-US\");\n    }\n    function relTime(d) {\n      if (!d) return \"—\";\n      var s = Math.floor((Date.now() - d) / 1000);\n      if (s < 60) return \"just now\";\n      var m = Math.floor(s / 60);\n      if (m < 60) return m + \" min ago\";\n      return Math.floor(m / 60) + \" hr ago\";\n    }\n    function clock(d) {\n      return d ? d.toLocaleTimeString(\"en-US\", { hour: \"2-digit\", minute: \"2-digit\" }) : \"—\";\n    }\n    function esc(s) {\n      return String(s == null ? \"\" : s).replace(/[&<>\"]/g, function (c) {\n        return { \"&\": \"&amp;\", \"<\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\" }[c];\n      });\n    }\n\n    // The layer's real schema. Pinning it means a fire is never labelled with the\n    // wrong column; the heuristics below stay only as a fallback if DNR renames a\n    // field out from under us.\n    var PINNED = {\n      name: \"INCIDENT_NM\", acres: \"ACRES_BURNED\", date: \"DSCVR_DT\",\n      contain: null, cause: \"FIREGCAUSE_LABEL_NM\", county: \"COUNTY_LABEL_NM\",\n      out: \"FIRE_OUT_DT\", control: \"CONTROL_DT\",\n    };\n\n    function pickFields(props) {\n      var keys = Object.keys(props || {});\n      // Fast path: the schema we know. Only fall through when it stops matching.\n      var pinnedOk = Object.keys(PINNED).every(function (k) {\n        return PINNED[k] == null || keys.indexOf(PINNED[k]) !== -1;\n      });\n      if (pinnedOk) {\n        return {\n          name: PINNED.name, acres: PINNED.acres, date: PINNED.date,\n          contain: PINNED.contain, cause: PINNED.cause, county: PINNED.county,\n          out: PINNED.out, control: PINNED.control,\n        };\n      }\n      function named(re) {\n        return keys.find(function (k) {\n          return re.test(k) && props[k] != null && String(props[k]).trim() !== \"\";\n        });\n      }\n      // Prefer name-like keys that actually carry a value; never a number/ID field\n      var name =\n        named(/(incident|fire).*(nm|name)$/i) ||\n        named(/(nm|name)$/i) ||\n        named(/^name$/i) ||\n        keys.find(function (k) { return /(incident|fire).*(nm|name)$/i.test(k); }) ||\n        keys.find(function (k) { return /^name$/i.test(k); });\n      var acres =\n        keys.find(function (k) { return /acre/i.test(k) && typeof props[k] === \"number\"; }) ||\n        keys.find(function (k) { return /acre/i.test(k); }) ||\n        keys.find(function (k) { return /(fire.?size|size|gis_?acre)/i.test(k); });\n      var date = keys.find(function (k) { return /start.*(dt|date)|dscvr|discover|report.*dt|ign/i.test(k); });\n      var contain = named(/contain|percent|pct/i) || keys.find(function (k) { return /contain|percent|pct/i.test(k); });\n      var cause = named(/cause.*(nm|name|label)|^cause$|cause/i);\n      var county = named(/county.*(nm|name|label)|county|region.*name|district/i);\n      var out = keys.find(function (k) { return /(fire_?out|out_?dt|extinguish)/i.test(k); });\n      var control = keys.find(function (k) { return /control_?dt|contained_?dt/i.test(k); });\n      return { name: name, acres: acres, date: date, contain: contain, cause: cause,\n               county: county, out: out, control: control };\n    }\n\n    function radiusForAcres(a) {\n      if (!a || a <= 0) return 4;\n      return Math.max(4, Math.min(26, 3 + Math.sqrt(a) * 0.35));\n    }\n    function sizeBand(a) {\n      if (isNaN(a) || a == null) return \"Size unreported\";\n      if (a >= 10000) return \"Very large\";\n      if (a >= 1000) return \"Large\";\n      if (a >= 100) return \"Significant\";\n      if (a >= 10) return \"Moderate\";\n      return \"Small\";\n    }\n    function dateStr(v) {\n      if (v == null || v === \"\") return null;\n      var d = typeof v === \"number\" ? new Date(v) : new Date(String(v));\n      if (isNaN(d.getTime())) return null;\n      return d.toLocaleDateString(\"en-US\", { month: \"short\", day: \"numeric\", year: \"numeric\" });\n    }\n\n    function setSync(state) {\n      $syncDot.className = \"dot\" + (state === \"ok\" ? \"\" : \" \" + state);\n    }\n    function tickRel() {\n      if (!lastSync) return;\n      $syncText.textContent = \"Synced \" + clock(lastSync) + \" · \" + relTime(lastSync);\n      setSync(Date.now() - lastSync > REFRESH_MS * 1.5 ? \"stale\" : \"ok\");\n    }\n\n    function isBlank(v) {\n      return v == null || v === \"\";\n    }\n    function asTime(v) {\n      if (isBlank(v)) return NaN;\n      var d = typeof v === \"number\" ? new Date(v) : new Date(String(v));\n      return d.getTime();\n    }\n\n    // No out-date on file. This is what the feed literally tells us, and it is a\n    // reporting state — not proof the fire is still burning.\n    function awaitingOut(p, fields) {\n      if (!fields.out) return true;\n      return isBlank(p[fields.out]);\n    }\n    function isControlled(p, fields) {\n      if (!fields.control) return false;\n      var v = p[fields.control];\n      return !(v == null || v === \"\");\n    }\n\n    // Both feeds get flattened to this shape so the map and tooltips don't have\n    // to care which service a fire came from.\n    function nifcRecord(f) {\n      var p = f.properties || {};\n      var c = f.geometry && f.geometry.coordinates;\n      // DailyAcres is the reported size; CalculatedAcres is derived from the\n      // perimeter and is the better number when a perimeter exists.\n      var acres = p.DailyAcres;\n      if (acres == null || acres === \"\") acres = p.CalculatedAcres;\n      return {\n        src: \"nifc\",\n        lat: c ? c[1] : null, lng: c ? c[0] : null,\n        name: p.IncidentName, acres: Number(acres),\n        contained: p.PercentContained == null || p.PercentContained === \"\"\n          ? null : Number(p.PercentContained),\n        discovered: p.FireDiscoveryDateTime,\n        cause: p.FireCause, county: p.POOCounty,\n        out: !isBlank(p.FireOutDateTime),\n      };\n    }\n    function dnrRecord(f, fields) {\n      var p = f.properties || {};\n      var c = f.geometry && f.geometry.coordinates;\n      return {\n        src: \"dnr\",\n        lat: c ? c[1] : null, lng: c ? c[0] : null,\n        name: fields.name ? p[fields.name] : null,\n        acres: fields.acres ? Number(p[fields.acres]) : NaN,\n        contained: null,\n        discovered: fields.date ? p[fields.date] : null,\n        cause: fields.cause ? p[fields.cause] : null,\n        county: fields.county ? p[fields.county] : null,\n        out: !awaitingOut(p, fields),\n        controlled: isControlled(p, fields),\n      };\n    }\n\n    // A NIFC incident is still burning unless it is out or fully contained.\n    function nifcBurning(r) {\n      return !r.out && !(r.contained != null && r.contained >= 100);\n    }\n\n    function tally(list) {\n      var t = { count: list.length, acres: 0, large: 0, largest: null };\n      list.forEach(function (r) {\n        var a = Number(r.acres);\n        if (isNaN(a)) return;\n        t.acres += a;\n        if (a >= 100) t.large++;\n        if (!t.largest || a > t.largest.acres) {\n          t.largest = { acres: a, name: r.name };\n        }\n      });\n      return t;\n    }\n\n    // incidents: statewide current fires (NIFC). season: DNR-protected year to date.\n    function renderStats(incidents, season, nifcFailed) {\n      var burning = incidents.filter(nifcBurning);\n      var a = tally(incidents);\n      var s = tally(season);\n      var uncontained = burning.filter(function (r) {\n        return r.contained == null || r.contained < 100;\n      }).length;\n\n      var seasonYear = new Date().getFullYear();\n      var largestBlock = a.largest && a.largest.name\n        ? '<div class=\"largest\"><div class=\"label\">Largest active<\u002Fdiv><div class=\"name\">' +\n          esc(a.largest.name) + '<\u002Fdiv><div class=\"sub\">' + fmt(a.largest.acres) + ' acres<\u002Fdiv><\u002Fdiv>'\n        : \"\";\n      // Never let a silent NIFC failure read as \"no fires burning\".\n      var activeBlock = nifcFailed\n        ? '<div class=\"msg\">Statewide incident feed (NIFC) unreachable — showing ' +\n          'DNR season totals only.<\u002Fdiv>'\n        : '<div class=\"stat lead\"><span class=\"label\">Active incidents<\u002Fspan><span class=\"value\">' + fmt(a.count) + '<\u002Fspan><\u002Fdiv>' +\n          '<div class=\"stat\"><span class=\"label\">Acres burned · active<\u002Fspan><span class=\"value\">' + fmt(a.acres) + '<span class=\"unit\">ac<\u002Fspan><\u002Fspan><\u002Fdiv>' +\n          '<div class=\"stat\"><span class=\"label\">Not yet contained<\u002Fspan><span class=\"value\">' + fmt(uncontained) + '<\u002Fspan><\u002Fdiv>' +\n          '<div class=\"stat\"><span class=\"label\">Large fires · 100+ ac<\u002Fspan><span class=\"value\">' + fmt(a.large) + '<\u002Fspan><\u002Fdiv>' +\n          largestBlock;\n\n      $body.innerHTML =\n        '<div class=\"stats\">' +\n          '<div class=\"grp\">Active statewide · all agencies<\u002Fdiv>' +\n          activeBlock +\n          '<div class=\"grp\">' + seasonYear + ' season to date · DNR-protected<\u002Fdiv>' +\n          '<div class=\"stat sm\"><span class=\"label\">Fires to date<\u002Fspan><span class=\"value\">' + fmt(s.count) + '<\u002Fspan><\u002Fdiv>' +\n          '<div class=\"stat sm\"><span class=\"label\">Acres burned to date<\u002Fspan><span class=\"value\">' + fmt(s.acres) + '<span class=\"unit\">ac<\u002Fspan><\u002Fspan><\u002Fdiv>' +\n        '<\u002Fdiv>';\n    }\n\n    function tipHTML(name, acres, extras) {\n      var rows =\n        '<div class=\"tip-k\">Acres burned<\u002Fdiv><div class=\"tip-v\">' +\n        (isNaN(acres) || acres == null ? \"n/a\" : fmt(acres)) + '<\u002Fdiv>' +\n        '<div class=\"tip-k\">Scale<\u002Fdiv><div class=\"tip-v\">' + esc(sizeBand(acres)) + '<\u002Fdiv>';\n      extras.forEach(function (r) {\n        rows += '<div class=\"tip-k\">' + esc(r[0]) + '<\u002Fdiv><div class=\"tip-v\">' + esc(r[1]) + '<\u002Fdiv>';\n      });\n      return '<div class=\"tip-name\">' + esc(name || \"Unnamed incident\") + '<\u002Fdiv>' +\n             '<div class=\"tip-rows\">' + rows + '<\u002Fdiv>';\n    }\n\n    // Season fires sit underneath as small ash dots for context; live incidents\n    // burn ember on top. Without the context layer the map reads as empty, since\n    // only a few dozen of the season's several hundred fires are burning now.\n    function styleFor(rec) {\n      if (rec.src === \"dnr\") {\n        return { radius: Math.max(2.5, radiusForAcres(rec.acres) * 0.5),\n                 color: \"#767b83\", weight: 0.9, opacity: 0.5,\n                 fillColor: \"#4b5058\", fillOpacity: 0.28 };\n      }\n      if (!nifcBurning(rec)) {\n        return { radius: Math.max(4, radiusForAcres(rec.acres) * 0.85),\n                 color: \"#c79a6d\", weight: 1.1, opacity: 0.8,\n                 fillColor: \"#8f6236\", fillOpacity: 0.34 };\n      }\n      return { radius: radiusForAcres(rec.acres),\n               color: EMBER_HOT, weight: 1.25, opacity: 0.95,\n               fillColor: EMBER, fillOpacity: 0.45 };\n    }\n\n    function statusLabel(rec) {\n      if (rec.src === \"dnr\") {\n        if (rec.out) return \"Out · DNR record\";\n        return rec.controlled ? \"Controlled · DNR record\" : \"Open · DNR record\";\n      }\n      if (rec.out) return \"Out\";\n      if (rec.contained != null && rec.contained >= 100) return \"Contained\";\n      return \"Active\";\n    }\n\n    function addMarker(rec) {\n      if (rec.lat == null || rec.lng == null) return;\n      var base = styleFor(rec);\n      var m = L.circleMarker([rec.lat, rec.lng], {\n        pane: \"fire\", radius: base.radius,\n        color: base.color, weight: base.weight, opacity: base.opacity,\n        fillColor: base.fillColor, fillOpacity: base.fillOpacity,\n      });\n\n      var extras = [[\"Status\", statusLabel(rec)]];\n      if (rec.contained != null && !isNaN(rec.contained)) {\n        extras.push([\"Contained\", rec.contained + \"%\"]);\n      }\n      if (rec.cause) extras.push([\"Cause\", rec.cause]);\n      if (rec.county) extras.push([\"Area\", rec.county]);\n      var ds = dateStr(rec.discovered);\n      if (ds) extras.push([\"Started\", ds]);\n      extras.push([\"Source\", rec.src === \"nifc\" ? \"NIFC interagency\" : \"WA DNR\"]);\n\n      var html = tipHTML(rec.name, rec.acres, extras);\n      m.bindTooltip(html, {\n        className: \"fire-tip\", direction: \"top\", sticky: true,\n        offset: [0, -Math.min(base.radius, 14)], opacity: 1,\n      });\n      m.on(\"mouseover\", function () {\n        this.setStyle({\n          fillOpacity: Math.min(0.85, base.fillOpacity + 0.3),\n          weight: base.weight + 0.75, color: \"#fff2e2\",\n        });\n      });\n      m.on(\"mouseout\", function () { this.setStyle(base); });\n      m.bindPopup(html, { maxWidth: 300 });\n      fireLayer.addLayer(m);\n    }\n\n    function drawMarkers(incidents, season) {\n      fireLayer.clearLayers();\n      season.forEach(addMarker);   // context first, so it sits beneath\n      incidents.forEach(addMarker);\n    }\n\n    // One page of the layer. Ordered by OBJECTID so offsets stay stable between\n    // pages; geoJSON responses carry no exceededTransferLimit flag, so a full\n    // page is the signal that more remains.\n    function fetchPage(endpoint, where, offset) {\n      var url = endpoint +\n        \"?where=\" + encodeURIComponent(where) +\n        \"&outFields=*&returnGeometry=true&outSR=4326\" +\n        \"&orderByFields=\" + encodeURIComponent(\"OBJECTID ASC\") +\n        \"&resultOffset=\" + offset +\n        \"&resultRecordCount=\" + PAGE_SIZE +\n        \"&f=geojson\";\n      return fetch(url, { cache: \"no-store\" }).then(function (r) {\n        if (!r.ok) throw new Error(\"HTTP \" + r.status);\n        return r.json();\n      }).then(function (d) {\n        if (d && d.error) throw new Error(d.error.message || \"service error\");\n        return (d && d.features) || [];\n      });\n    }\n\n    function fetchAll(endpoint, where) {\n      var all = [];\n      function step(offset) {\n        return fetchPage(endpoint, where, offset).then(function (page) {\n          all = all.concat(page);\n          // Stop on a short page, or if the service ignores paging entirely.\n          if (page.length < PAGE_SIZE || all.length > 20000) return all;\n          return step(offset + PAGE_SIZE);\n        });\n      }\n      return step(0);\n    }\n\n    function load() {\n      $reload.disabled = true;\n      $reload.textContent = \"…\";\n      $syncText.textContent = \"Syncing…\";\n\n      // NIFC is allowed to fail on its own without taking the DNR panel down.\n      var nifcFailed = false;\n      Promise.all([\n        fetchAll(ENDPOINT, DEF_WHERE),\n        fetchAll(NIFC_ENDPOINT, NIFC_WHERE).catch(function (e) {\n          nifcFailed = true;\n          console.warn(\"NIFC incident feed failed:\", e.message);\n          return [];\n        }),\n      ])\n        .then(function (res) {\n          var dnrFeatures = res[0], nifcFeatures = res[1];\n          var fields = dnrFeatures.length ? pickFields(dnrFeatures[0].properties) : {};\n          var season = dnrFeatures.map(function (f) { return dnrRecord(f, fields); });\n          var incidents = nifcFeatures.map(nifcRecord);\n\n          renderStats(incidents, season, nifcFailed);\n          drawMarkers(incidents, season);\n\n          // Frame the live incidents; they're the operational picture. Fall back\n          // to everything drawn if NIFC gave us nothing.\n          if (!fitted) {\n            var pts = incidents.filter(function (r) { return r.lat != null; })\n                               .map(function (r) { return [r.lat, r.lng]; });\n            try {\n              var b = pts.length ? L.latLngBounds(pts) : fireLayer.getBounds();\n              if (b && b.isValid()) {\n                fitted = true;\n                map.fitBounds(b.pad(0.15), { maxZoom: 9 });\n              }\n            } catch (e) {}\n          }\n\n          lastSync = new Date();\n          setSync(nifcFailed ? \"stale\" : \"ok\");\n          tickRel();\n          var srcNote = document.querySelector(\".source\");\n          if (srcNote) {\n            srcNote.innerHTML =\n              'Active · <b>NIFC Current Incidents<\u002Fb> (' + fmt(incidents.length) + ' in WA)' +\n              '<br />Season · <b>WA DNR<\u002Fb> Current Fire Statistics (' + fmt(season.length) + ')' +\n              '<br />DNR totals cover DNR-protected land only; grey dots are this ' +\n              \"season's DNR fires.\";\n          }\n        })\n        .catch(function (err) {\n          setSync(\"err\");\n          $syncText.textContent = \"Feed unreachable\";\n          $body.innerHTML =\n            '<div class=\"msg\"><b>Couldn\\'t reach the fire feeds.<\u002Fb> ' +\n            \"The map chrome is fine — the live layers just didn't answer. \" +\n            \"If you're running this inside a sandbox, the request may be blocked by \" +\n            \"cross-origin rules; the same file served from your own domain or GitHub \" +\n            \"Pages will usually connect.\" +\n            '<span class=\"why\">' + esc(err.message) + \"<\u002Fspan><\u002Fdiv>\";\n        })\n        .finally(function () {\n          $reload.disabled = false;\n          $reload.textContent = \"Sync\";\n        });\n    }\n\n    // ---- Address search (Washington only) --------------------------------\n    (function setupFind() {\n      var GEO = \"https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer\";\n      // Washington bounding box — the geocoder is asked for nothing outside it\n      var WA = { xmin: -124.85, ymin: 45.5, xmax: -116.9, ymax: 49.05 };\n      var EXTENT = WA.xmin + \",\" + WA.ymin + \",\" + WA.xmax + \",\" + WA.ymax;\n      var CENTER = \"-120.4,47.3\";\n\n      var $in = document.getElementById(\"findInput\");\n      var $clear = document.getElementById(\"findClear\");\n      if (!$in) return;\n\n      var $list = document.createElement(\"ul\");\n      $list.className = \"find-list\";\n      $list.id = \"findList\";\n      $list.setAttribute(\"role\", \"listbox\");\n      document.body.appendChild($list);\n\n      var items = [], cursor = -1, timer = null, ctrl = null, pin = null;\n\n      function inWA(text) {\n        return /,\\s*(WA|Washington)\\b/i.test(text) || /\\bWashington,\\s*USA$/i.test(text);\n      }\n      function place() {\n        var r = $in.getBoundingClientRect();\n        $list.style.left = r.left + \"px\";\n        $list.style.top = r.bottom + 6 + \"px\";\n        $list.style.width = r.width + \"px\";\n      }\n      function close() {\n        $list.classList.remove(\"open\");\n        $in.setAttribute(\"aria-expanded\", \"false\");\n        cursor = -1;\n      }\n      function note(msg) {\n        items = [];\n        $list.innerHTML = '<li class=\"find-note\">' + esc(msg) + \"<\u002Fli>\";\n        place();\n        $list.classList.add(\"open\");\n        $in.setAttribute(\"aria-expanded\", \"true\");\n      }\n      function paint() {\n        $list.innerHTML = \"\";\n        items.forEach(function (s, i) {\n          var li = document.createElement(\"li\");\n          li.className = \"find-opt\" + (i === cursor ? \" on\" : \"\");\n          li.setAttribute(\"role\", \"option\");\n          li.setAttribute(\"aria-selected\", i === cursor ? \"true\" : \"false\");\n          var parts = String(s.text).split(\",\");\n          var head = parts.shift();\n          li.innerHTML = \"<strong>\" + esc(head) + \"<\u002Fstrong>\" + esc(parts.join(\",\").trim());\n          li.addEventListener(\"mousedown\", function (e) { e.preventDefault(); choose(i); });\n          $list.appendChild(li);\n        });\n        place();\n        $list.classList.add(\"open\");\n        $in.setAttribute(\"aria-expanded\", \"true\");\n      }\n      function move(d) {\n        if (!items.length) return;\n        cursor = (cursor + d + items.length) % items.length;\n        paint();\n        var on = $list.querySelector(\".find-opt.on\");\n        if (on) {\n          var lt = on.offsetTop, lb = lt + on.offsetHeight;\n          if (lt < $list.scrollTop) $list.scrollTop = lt;\n          else if (lb > $list.scrollTop + $list.clientHeight) $list.scrollTop = lb - $list.clientHeight;\n        }\n      }\n\n      function suggest(q) {\n        if (ctrl) ctrl.abort();\n        ctrl = new AbortController();\n        var url = GEO + \"/suggest?f=json&maxSuggestions=8&countryCode=USA\" +\n          \"&searchExtent=\" + encodeURIComponent(EXTENT) +\n          \"&location=\" + encodeURIComponent(CENTER) +\n          \"&text=\" + encodeURIComponent(q);\n        fetch(url, { signal: ctrl.signal })\n          .then(function (r) { return r.json(); })\n          .then(function (d) {\n            items = ((d && d.suggestions) || []).filter(function (s) {\n              return !s.isCollection && inWA(s.text);\n            }).slice(0, 6);\n            if (!items.length) { note(\"No Washington match\"); return; }\n            cursor = -1;\n            paint();\n          })\n          .catch(function (e) {\n            if (e.name !== \"AbortError\") note(\"Search unavailable\");\n          });\n      }\n\n      function choose(i) {\n        var s = items[i];\n        if (!s) return;\n        $in.value = s.text;\n        $clear.hidden = false;\n        close();\n        var url = GEO + \"/findAddressCandidates?f=json&outSR=4326&maxLocations=1\" +\n          \"&magicKey=\" + encodeURIComponent(s.magicKey) +\n          \"&singleLine=\" + encodeURIComponent(s.text);\n        fetch(url)\n          .then(function (r) { return r.json(); })\n          .then(function (d) {\n            var c = d && d.candidates && d.candidates[0];\n            if (!c || !c.location) { note(\"Couldn't locate that address\"); return; }\n            var lat = c.location.y, lng = c.location.x;\n            if (lat < WA.ymin || lat > WA.ymax || lng < WA.xmin || lng > WA.xmax) {\n              note(\"That address is outside Washington\");\n              return;\n            }\n            if (pin) map.removeLayer(pin);\n            pin = L.circleMarker([lat, lng], {\n              radius: 7, color: \"#b9c99a\", weight: 2.5, opacity: 1,\n              fillColor: \"#7a8a5e\", fillOpacity: 0.5,\n            }).addTo(map);\n            pin.bindTooltip(\n              '<div style=\"font-weight:600\">' + esc(s.text) + \"<\u002Fdiv>\",\n              { className: \"pin-tip\", direction: \"top\", offset: [0, -9], opacity: 1 }\n            );\n            map.setView([lat, lng], 12, { animate: true });\n            pin.openTooltip();\n          })\n          .catch(function () { note(\"Search unavailable\"); });\n      }\n\n      $in.addEventListener(\"input\", function () {\n        var q = $in.value.trim();\n        $clear.hidden = !q;\n        clearTimeout(timer);\n        if (q.length < 3) { close(); return; }\n        timer = setTimeout(function () { suggest(q); }, 180);\n      });\n      $in.addEventListener(\"keydown\", function (e) {\n        if (e.key === \"ArrowDown\") { e.preventDefault(); move(1); }\n        else if (e.key === \"ArrowUp\") { e.preventDefault(); move(-1); }\n        else if (e.key === \"Enter\") {\n          e.preventDefault();\n          choose(cursor < 0 ? 0 : cursor);\n        } else if (e.key === \"Escape\") { close(); }\n      });\n      $in.addEventListener(\"focus\", function () { if (items.length) paint(); });\n      $in.addEventListener(\"blur\", function () { setTimeout(close, 120); });\n      $clear.addEventListener(\"click\", function () {\n        $in.value = \"\";\n        $clear.hidden = true;\n        items = [];\n        close();\n        if (pin) { map.removeLayer(pin); pin = null; }\n        $in.focus();\n      });\n      window.addEventListener(\"resize\", function () { if ($list.classList.contains(\"open\")) place(); });\n      document.addEventListener(\"scroll\", function () { if ($list.classList.contains(\"open\")) place(); }, true);\n    })();\n\n    $reload.addEventListener(\"click\", load);\n    this.relTimer = setInterval(tickRel, 30 * 1000);\n    this.refreshTimer = setInterval(load, REFRESH_MS);\n    load();\n  }\n\n  renderVals() { return {}; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
